<div class="city-list-container">
  <h3>🌍 African Cities</h3>

  <!-- Search Box -->
  <div class="search-box">
    <input
      type="text"
      placeholder="🔍 Search city..."
      [(ngModel)]="searchTerm"
      (input)="filterCities()"
    />
  </div>

  <!-- Filters Section with auto-refresh -->
  <div class="filters-section">
    <div class="filter-group">
      <label>📅 Days:</label>
      <select [(ngModel)]="selectedDays" (change)="onFiltersChange()">
        <option [value]="1">1 day</option>
        <option [value]="3">3 days</option>
        <option [value]="5">5 days</option>
        <option [value]="7">7 days</option>
      </select>
    </div>

    <div class="filter-group">
      <label>🤖 AI Summary:</label>
      <select [(ngModel)]="includeAI" (change)="onFiltersChange()">
        <option [value]="true">Enabled</option>
        <option [value]="false">Disabled</option>
      </select>
    </div>

    <div class="filter-group">
      <label>🌡️ Units:</label>
      <select [(ngModel)]="selectedUnits" (change)="onFiltersChange()">
        <option value="metric">Metric (°C)</option>
        <option value="imperial">Imperial (°F)</option>
      </select>
    </div>

    <div class="filter-group">
      <label>🌐 Language:</label>
      <select [(ngModel)]="selectedLang" (change)="onFiltersChange()">
        <option value="en">English</option>
        <option value="pt">Portuguese</option>
        <option value="fr">French</option>
        <option value="sw">Swahili</option>
        <option value="ar">Arabic</option>
      </select>
    </div>

    <div class="filter-group">
      <label>🌐 Weather Type:</label>
      <select [(ngModel)]="weatherType">
        <option value="weather">Weather</option>
        <option value="forecast">Forecast</option>
        <option value="current">Current</option>
        <option value="daily">Daily</option>
        <option value="hourly">Hourly</option>
      </select>
    </div>
  </div>

  <!-- Cities Grid -->
  <div class="cities-grid" *ngIf="!loading">
    <button
      *ngFor="let city of filteredCities"
      class="city-btn"
      [class.active]="city === selectedCity"
      (click)="selectCity(city)"
    >
      {{ city }}
    </button>
  </div>

  <!-- Loading State -->
  <div class="loading" *ngIf="loading">
    <div class="spinner"></div>
    <p>Loading weather...</p>
  </div>

  <!-- No Results -->
  <div class="no-results" *ngIf="filteredCities.length === 0 && !loading">
    <p>😕 No cities found</p>
  </div>
</div>
